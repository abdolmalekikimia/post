name: QA Portfolio Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Run default safe suite
        run: python -m pytest -q

      - name: Scan tracked files for high-risk patterns
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -n -I -E 'github_pat_|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\\.|Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{30,}' -- . ':!.github/workflows/qa.yml' || true)
          if [[ -n "$matches" ]]; then
            echo "Potential secret pattern found. Review the matching lines."
            echo "$matches"
            exit 1
          fi
