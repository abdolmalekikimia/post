[pytest]
testpaths = tests
markers =
    e2e: end-to-end tests that require a running local demo service
    history_backend_negative: History Backend negative scenarios
    delivery_merge_negative: Delivery Merge negative scenarios
    lazy_upload_negative: Lazy Upload negative scenarios
    stress: volume/endurance tests
    history_backend_stress: History Backend stress scenarios
    delivery_merge_stress: Delivery Merge stress scenarios
    destination_update_stress: Destination Update destination update race stress scenario
    websocket: focused WebSocket/SignalR device flow
    success: end-to-end success flows
    negative: task-oriented negative scenarios
    configuration_sync_negative: Configuration Sync negative configuration synchronization scenarios
    device_lifecycle_negative: Device Lifecycle device lifecycle negative scenarios
    policy_sync_negative: Policy Sync RoutingPolicy negative scenarios
    bag_selection_negative: Bag Selection bag parcel selection negative scenarios
    destination_assignment_negative: Destination Assignment destination assignment negative scenarios
    destination_update_negative: Destination Update destination update negative scenarios
    status_override_negative: Status Override negative scenarios
    destination_lookup_negative: Destination Lookup negative scenarios
    configuration_sync_success: Configuration Sync success flow
    history_backend_success: History Backend success flow
    destination_lookup_success: Destination Lookup success flow
    lazy_upload_success: Lazy Upload success flow
    destination_assignment_success: Destination Assignment success flow
    destination_update_success: Destination Update success flow
    device_lifecycle_success: Device Lifecycle success flow
    mixed: tests that combine REST and SignalR/WebSocket transport
    container_selection_negative: Container Selection negative scenarios
    export_before_container_negative: Export Before Container negative scenarios
    container_response_response: Container Response contract scenarios
    physical_container_audit_negative: Physical Container Audit negative scenarios
    container_selection_success: Container Selection success flow
    export_before_container_success: Export Before Container success flow
    container_response_success: Container Response success flow
    physical_container_audit_success: Physical Container Audit success flow
    packing: Shared container contract suite
    packing_success: Packing success scenarios
    packing_negative: Packing negative scenarios
