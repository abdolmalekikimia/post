[pytest]
testpaths = tests
addopts = -s --tb=short --ignore=tests/stress --ignore=tests/unit/test_stress.py -m "not stress"
markers =
    e2e: end-to-end tests that require a running Edge service
    load: load and rate tests
    health_check: connection health check scenarios
    close_bag: close-bag scenarios
    no_barcode: parcels without a barcode, special chutes and re-reads
    two_lines: one center with two sorting lines
    ws_session: WebSocket device sessions
    postal_contracts: Postal error-code preservation and Mock status
    core_history_negative: core history negative scenarios
    postal_coordination_negative: postal coordination negative scenarios
    postal_coordination_success: postal coordination positive orchestration scenarios
    destination_lookup_negative: destination lookup Pending response and barcode routing scenarios
    lazy_upload_negative: lazy upload negative scenarios
    reread_negative: reread state-driven reread negative scenarios
    stress: volume/endurance tests
    core_history_stress: core history stress scenarios
    postal_coordination_stress: postal coordination stress scenarios
    destination_update_stress: destination update race stress scenario
    websocket: focused WebSocket/SignalR device flow
    api: HTTP/API transport tests
    signalr: SignalR transport tests
    mixed: tests that combine HTTP/API and SignalR
    smoke: cross-EPS smoke tests
    catalog: case catalog tests without E2E execution
    contract: shared contract tests across EPS families
    success: end-to-end success flows
    negative: task-oriented negative scenarios
    config_sync_negative: config sync negative configuration synchronization scenarios
    device_lifecycle_negative: device lifecycle negative scenarios
    device_lifecycle_success: device lifecycle success scenario
    policy_sync_negative: policy sync AutoDispatchPolicy negative scenarios
    bag_selection_negative: bag selection bag parcel selection negative scenarios
    destination_assignment_negative: destination assignment negative scenarios
    destination_update_negative: destination update negative scenarios
    status_override_negative: status override Core status override scenarios
    export_before_container_negative: export before container export-before-bag negative scenarios
    label_negative: label bag label and disconnection negative scenarios
    label_success: label bag label generation and retry success scenarios
    container_response_response: container response bag.close response contract scenarios
    physical_audit_negative: physical audit physical bag audit scenarios
    operational_events_negative: operational events central event registration negative scenarios
    operational_events_success: operational events central event registration success scenarios
    config_sync_success: config sync healthy synchronization/auth success
    policy_sync_success: policy sync healthy AutoDispatchPolicy synchronization success
    core_history_success: core history Core history success cases
    destination_lookup_success: destination lookup successful destination lookup
    lazy_upload_success: lazy upload valid image registration success
    reread_success: reread state-driven reread positive scenarios
    destination_assignment_success: destination assignment positive destination assignment cases
    destination_update_success: destination update positive destination update cases
    bag_selection_success: bag selection successful bag close
    export_before_container_success: export before container successful bag close
    label_success: label successful bag label and retry scenarios
    container_response_success: container response successful bag response contract
    physical_audit_success: physical audit successful bag close path
    inbound_query_success: inbound query Core inbound query success scenarios
    inbound_query_negative: inbound query Core inbound query returning/returned-to-origin scenarios
    presigned_url: presigned url Object Storage and Pre-signed URL scenarios
    presigned_url_success: presigned url Object Storage success scenarios
    presigned_url_negative: presigned url Object Storage unauthorized and expiry scenarios
    status_evaluator: status evaluator Parcel Status Evaluation scenarios
    status_evaluator_success: status evaluator Status evaluation success scenarios
    operational_result: operational result Operational Result Storage scenarios
    operational_result_success: operational result Operational Result success scenarios
    operational_result_negative: operational result Operational Result negative scenarios
    bag_dispatch: bag dispatch Bag/Dispatch Storage scenarios
    bag_dispatch_success: bag dispatch Bag/Dispatch success scenarios
    bag_dispatch_negative: bag dispatch Bag/Dispatch negative scenarios
    image_metadata: image metadata Image Metadata Registration scenarios
    image_metadata_success: image metadata Image Metadata success scenarios
