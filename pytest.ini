[pytest]
testpaths = tests
addopts = -s --tb=no --ignore=tests/stress --ignore=tests/unit/test_stress.py -m "not stress"
markers =
    e2e: end-to-end tests that require a running EPS service
    eps53_negative: EPS-53 negative scenarios
    eps55_negative: EPS-55 negative scenarios
    eps55_success: EPS-55 positive orchestration scenarios
    eps60_negative: EPS-60 Pending response and barcode routing scenarios
    eps64_negative: EPS-64 negative scenarios
    eps66_negative: EPS-66 state-driven reread negative scenarios
    stress: volume/endurance tests
    eps53_stress: EPS-53 stress scenarios
    eps55_stress: EPS-55 stress scenarios
    eps73_stress: EPS-73 destination update race stress scenario
    websocket: focused WebSocket/SignalR device flow
    api: HTTP/API transport tests
    signalr: SignalR transport tests
    mixed: tests that combine HTTP/API and SignalR
    smoke: cross-EPS smoke tests
    catalog: case catalog tests without E2E execution
    contract: shared contract tests across EPS families
    success: end-to-end success flows
    negative: task-oriented negative scenarios
    eps40_negative: EPS-40 negative configuration synchronization scenarios
    eps49_negative: EPS-49 device lifecycle negative scenarios
    eps49_success: EPS-49 device lifecycle success scenario
    eps46_negative: EPS-46 AutoDispatchPolicy negative scenarios
    eps76_negative: EPS-76 bag parcel selection negative scenarios
    eps71_negative: EPS-71 destination assignment negative scenarios
    eps73_negative: EPS-73 destination update negative scenarios
    eps68_negative: EPS-68 Core status override scenarios
    eps79_negative: EPS-79 export-before-bag negative scenarios
    eps83_negative: EPS-83 bag label and disconnection negative scenarios
    eps83_success: EPS-83 bag label generation and retry success scenarios
    eps87_response: EPS-87 bag.close response contract scenarios
    eps89_negative: EPS-89 physical bag audit scenarios
    eps113_negative: EPS-113 central event registration negative scenarios
    eps113_success: EPS-113 central event registration success scenarios
    eps40_success: EPS-40 healthy synchronization/auth success
    eps46_success: EPS-46 healthy AutoDispatchPolicy synchronization success
    eps53_success: EPS-53 Core history success cases
    eps60_success: EPS-60 successful destination lookup
    eps64_success: EPS-64 valid image registration success
    eps66_success: EPS-66 state-driven reread positive scenarios
    eps71_success: EPS-71 positive destination assignment cases
    eps73_success: EPS-73 positive destination update cases
    eps76_success: EPS-76 successful bag close
    eps79_success: EPS-79 successful bag close
    eps83_success: EPS-83 successful bag label and retry scenarios
    eps87_success: EPS-87 successful bag response contract
    eps89_success: EPS-89 successful bag close path
    cps20_success: CPS-20 Core inbound query success scenarios
    cps20_negative: CPS-20 Core inbound query returning/returned-to-origin scenarios
    cps80: CPS-80 Object Storage and Pre-signed URL scenarios
    cps80_success: CPS-80 Object Storage success scenarios
    cps80_negative: CPS-80 Object Storage unauthorized and expiry scenarios
    cps65: CPS-65 Parcel Status Evaluation scenarios
    cps65_success: CPS-65 Status evaluation success scenarios
    cps86: CPS-86 Operational Result Storage scenarios
    cps86_success: CPS-86 Operational Result success scenarios
    cps86_negative: CPS-86 Operational Result negative scenarios
    cps67: CPS-67 Bag/Dispatch Storage scenarios
    cps67_success: CPS-67 Bag/Dispatch success scenarios
    cps67_negative: CPS-67 Bag/Dispatch negative scenarios
    cps58: CPS-58 Image Metadata Registration scenarios
    cps58_success: CPS-58 Image Metadata success scenarios
    cps58_negative: CPS-58 Image Metadata negative scenarios
    packing: shared bag.close contract suite
    packing_success: packing Success tests
    packing_success: packing Success tests
    packing_negative: packing Negative tests
    cps74_success: CPS-74 Sorting Device Management success scenarios
    cps74_negative: CPS-74 Sorting Device Management negative scenarios
    cps82: CPS-82 Edge Health Monitoring scenarios
    cps82_success: CPS-82 Edge Health Monitoring success scenarios
    cps82_negative: CPS-82 Edge Health Monitoring negative scenarios
    cps77: CPS-77 Bootstrap Configuration Management scenarios
    cps77_success: CPS-77 Bootstrap Configuration success scenarios
    cps77_negative: CPS-77 Bootstrap Configuration negative scenarios
