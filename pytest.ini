[pytest]
testpaths = tests
markers =
    e2e: end-to-end tests that require a running EPS service
    eps53_negative: EPS-53 negative scenarios
    eps55_negative: EPS-55 negative scenarios
    eps64_negative: EPS-64 negative scenarios
    stress: volume/endurance tests
    eps53_stress: EPS-53 stress scenarios
    eps55_stress: EPS-55 stress scenarios
    websocket: focused WebSocket/SignalR device flow
    success: end-to-end success flows
    negative: task-oriented negative scenarios
    eps40_negative: EPS-40 negative configuration synchronization scenarios
    eps49_negative: EPS-49 device lifecycle negative scenarios
    eps46_negative: EPS-46 AutoDispatchPolicy negative scenarios
