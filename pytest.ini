[pytest]
testpaths = tests
addopts = -s --tb=short --ignore=tests/stress --ignore=tests/unit/test_stress.py -m "not stress"
markers =
    e2e: end-to-end tests that require a running EPS service
    eps53_negative: EPS-53 negative scenarios
    eps55_negative: EPS-55 negative scenarios
    eps55_success: EPS-55 positive orchestration scenarios
    eps60_negative: EPS-60 Pending response and barcode routing scenarios
    eps64_negative: EPS-64 negative scenarios
    eps66_negative: EPS-66 state-driven reread negative scenarios
    stress: volume/endurance tests
    eps53_stress: EPS-53 stress scenarios
    eps55_stress: EPS-55 stress scenarios
    eps73_stress: EPS-73 destination update race stress scenario
    websocket: focused WebSocket/SignalR device flow
    api: HTTP/API transport tests
    signalr: SignalR transport tests
    mixed: tests that combine HTTP/API and SignalR
    smoke: cross-EPS smoke tests
    catalog: case catalog tests without E2E execution
    contract: shared contract tests across EPS families
    success: end-to-end success flows
    negative: task-oriented negative scenarios
    eps40_negative: EPS-40 negative configuration synchronization scenarios
    eps49_negative: EPS-49 device lifecycle negative scenarios
    eps49_success: EPS-49 device lifecycle success scenario
    eps46_negative: EPS-46 AutoDispatchPolicy negative scenarios
